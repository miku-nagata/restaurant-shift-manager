<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務希望一覧</title>
    <style>
        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 8px;
        }
    </style>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js@8.3.2/minified/introjs.min.css">
</head>

<body>
    <div class="container">
        <h1>勤務希望一覧</h1>

        <p>登録されている勤務希望を表示します。</p>

        <div class="calendar-header">
            <a class="action-button" th:href="@{/shift-requests(year=${previousYear}, month=${previousMonth})}">
                前月
            </a>

            <h2 th:text="${targetMonth.year} + '年' + ${targetMonth.monthValue} + '月'">
                2026年8月
            </h2>

            <a class="action-button" th:href="@{/shift-requests(year=${nextYear}, month=${nextMonth})}">
                翌月
            </a>
        </div>

        <p>
            <a href="/shift-requests/new" id="tutorial-new-shift-request">
                勤務希望を新規登録する
            </a>
        </p>

        <table class="calendar-table" id="tutorial-shift-calendar">
            <thead>
                <tr>
                    <th>日</th>
                    <th>月</th>
                    <th>火</th>
                    <th>水</th>
                    <th>木</th>
                    <th>金</th>
                    <th>土</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="week : ${calendarWeeks}">

                    <td th:each="date : ${week}">

                        <!-- 勤務希望が1件以上ある日 -->
                        <button th:if="${date != null and shiftRequestsByDate.containsKey(date)}" type="button"
                            class="calendar-day shift-request-calendar-day clickable-day" th:attr="data-date=${date}"
                            onclick="showShiftRequests(this)">

                            <div class="calendar-date" th:text="${date.dayOfMonth}">
                                1
                            </div>

                            <div class="calendar-status" th:text="${shiftRequestsByDate.get(date).size()} + '件'">
                                3件
                            </div>

                        </button>

                        <!-- 勤務希望が0件の日 -->
                        <div th:if="${date != null and !shiftRequestsByDate.containsKey(date)}"
                            class="calendar-day shift-request-calendar-day">

                            <div class="calendar-date" th:text="${date.dayOfMonth}">
                                1
                            </div>

                            <div class="calendar-status">
                                0件
                            </div>

                        </div>

                    </td>

                </tr>
            </tbody>
        </table>

        <div class="shift-request-details">

            <div th:each="entry : ${shiftRequestsByDate}" class="shift-request-detail"
                th:id="'requests-' + ${entry.key}" style="display: none;">

                <h2>
                    <span th:text="${entry.key.monthValue}">8</span>月
                    <span th:text="${entry.key.dayOfMonth}">6</span>日の勤務希望
                </h2>

                <table>
                    <thead>
                        <tr>
                            <th>従業員名</th>
                            <th>開始時刻</th>
                            <th>終了時刻</th>
                            <th>希望区分</th>
                            <th>操作</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="shiftRequest : ${entry.value}">

                            <td th:text="${shiftRequest.employee.name}">
                                山田 太郎
                            </td>

                            <td th:text="${shiftRequest.startTime != null
                                      ? shiftRequest.startTime
                                      : '-'}">
                                09:00
                            </td>

                            <td th:text="${shiftRequest.endTime != null
                                      ? shiftRequest.endTime
                                      : '-'}">
                                17:00
                            </td>

                            <td th:text="${shiftRequest.requestType}">
                                出勤希望
                            </td>

                            <td>
                                <a th:href="@{/shift-requests/{id}/edit(id=${shiftRequest.id})}">
                                    編集
                                </a>

                                <form th:action="@{/shift-requests/{id}/delete(id=${shiftRequest.id})}" method="post"
                                    style="display:inline;">

                                    <button type="submit" class="danger-button"
                                        onclick="return confirm('この勤務希望を削除しますか？');">
                                        削除
                                    </button>

                                </form>
                            </td>

                        </tr>
                    </tbody>
                </table>

            </div>

        </div>

        <p>
            <a href="/">トップページへ戻る</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/intro.js@8.3.2/minified/intro.min.js"></script>
    <script>
        let dayTutorial = null;
        let tutorialDayClicked = false;

        document.addEventListener('DOMContentLoaded', function () {

            const tutorialStep = sessionStorage.getItem('tutorialStep');

            // STEP4から勤務希望画面に来た場合
            if (tutorialStep === '4') {

                const tour = introJs.tour();

                tour.setOptions({
                    steps: [
                        {
                            element: document.querySelector('#tutorial-new-shift-request'),
                            title: 'STEP 4',
                            intro: '勤務希望の新規登録はこちらから行います。'
                        },
                        {
                            element: document.querySelector('#tutorial-shift-calendar'),
                            title: 'STEP 5',
                            intro: '提出された勤務希望は、カレンダーに日付ごとの件数で表示されます。'
                        }
                    ],
                    nextLabel: '次へ',
                    prevLabel: '戻る',
                    doneLabel: '次へ',

                    // 紹介中はリンクなどをクリックさせない
                    disableInteraction: true,

                    exitOnEsc: true,
                    exitOnOverlayClick: true
                });

                tour.onComplete(function () {

                    // 次はSTEP6
                    sessionStorage.setItem('tutorialStep', '6');

                    setTimeout(function () {
                        startDayTutorial();
                    }, 300);
                });

                tour.start();
            }
        });


        // STEP6
        // 実際にカレンダーの日付をクリックしてもらう
        function startDayTutorial() {

            const firstClickableDay =
                document.querySelector('.clickable-day');

            if (!firstClickableDay) {
                sessionStorage.removeItem('tutorialStep');
                return;
            }

            tutorialDayClicked = false;

            dayTutorial = introJs.tour();

            dayTutorial.setOptions({
                steps: [
                    {
                        element: firstClickableDay,
                        title: 'STEP 6',
                        intro: '勤務希望が登録されている日をクリックしてみてください。'
                    }
                ],

                // 「次へ」は出さない
                showButtons: false,

                exitOnEsc: true,
                exitOnOverlayClick: true,

                // 日付は実際にクリックできる
                disableInteraction: false
            });

            dayTutorial.onExit(function () {

                // 日付クリックによる終了ではなく、
                // ユーザーが途中終了した場合だけ状態を消す
                if (!tutorialDayClicked) {
                    sessionStorage.removeItem('tutorialStep');
                }
            });

            dayTutorial.start();
        }


        // もともとある日付クリック処理
        function showShiftRequests(button) {

            // すべての日付から選択状態を外す
            document.querySelectorAll('.clickable-day').forEach(day => {
                day.classList.remove('selected-day');
            });

            // クリックした日を選択状態にする
            button.classList.add('selected-day');

            // クリックされた日付を取得
            const date = button.dataset.date;

            // 全日の詳細を一度非表示
            const details =
                document.querySelectorAll('.shift-request-detail');

            details.forEach(detail => {
                detail.style.display = 'none';
            });

            // クリックされた日の詳細を取得
            const selected =
                document.getElementById('requests-' + date);

            // その日の詳細だけ表示
            if (selected) {
                selected.style.display = 'block';
            }


            // STEP6中に日付がクリックされた場合
            if (
                sessionStorage.getItem('tutorialStep') === '6'
                && selected
            ) {

                tutorialDayClicked = true;

                // 次はSTEP7
                sessionStorage.setItem('tutorialStep', '7');

                // STEP6を閉じる
                if (dayTutorial) {
                    dayTutorial.exit();
                }

                // STEP7
                setTimeout(function () {
                    const detailTour = introJs.tour();

                    detailTour.setOptions({
                        steps: [
                            {
                                element: selected,
                                title: 'STEP 7',
                                intro: 'ここで、その日に出勤できるスタッフと希望時間を確認できます。'
                            }
                        ],
                        doneLabel: '完了',
                        exitOnEsc: true,
                        exitOnOverlayClick: true
                    });

                    detailTour.onComplete(function () {
                        sessionStorage.removeItem('tutorialStep');
                    });

                    detailTour.onExit(function () {
                        sessionStorage.removeItem('tutorialStep');
                    });

                    detailTour.start();
                }, 300);
            }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務希望一覧</title>
    <style>
        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 8px;
        }
    </style>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="container">
        <h1>勤務希望一覧</h1>

        <p>登録されている勤務希望を表示します。</p>

        <div class="calendar-header">
            <a class="action-button" th:href="@{/shift-requests(year=${previousYear}, month=${previousMonth})}">
                前月
            </a>

            <h2 th:text="${targetMonth.year} + '年' + ${targetMonth.monthValue} + '月'">
                2026年8月
            </h2>

            <a class="action-button" th:href="@{/shift-requests(year=${nextYear}, month=${nextMonth})}">
                翌月
            </a>
        </div>

        <p>
            <a href="/shift-requests/new">勤務希望を新規登録する</a>
        </p>

        <table class="calendar-table">
            <thead>
                <tr>
                    <th>日</th>
                    <th>月</th>
                    <th>火</th>
                    <th>水</th>
                    <th>木</th>
                    <th>金</th>
                    <th>土</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="week : ${calendarWeeks}">

                    <td th:each="date : ${week}">
                        <div th:if="${date != null}" class="calendar-day shift-request-calendar-day">

                            <!-- 日付 -->
                            <div class="calendar-date" th:text="${date.dayOfMonth}">
                                1
                            </div>

                            <!-- その日の勤務希望件数 -->
                            <div class="calendar-status" th:text="${shiftRequestsByDate.containsKey(date)
                                      ? shiftRequestsByDate.get(date).size() + '件'
                                      : '0件'}">
                                0件
                            </div>

                        </div>
                    </td>

                </tr>
            </tbody>
        </table>

        <p>
            <a href="/">トップページへ戻る</a>
        </p>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務希望一覧</title>
    <style>
        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 8px;
        }
    </style>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="container">
        <h1>勤務希望一覧</h1>

        <p>登録されている勤務希望を表示します。</p>

        <div class="calendar-header">
            <a class="action-button" th:href="@{/shift-requests(year=${previousYear}, month=${previousMonth})}">
                前月
            </a>

            <h2 th:text="${targetMonth.year} + '年' + ${targetMonth.monthValue} + '月'">
                2026年8月
            </h2>

            <a class="action-button" th:href="@{/shift-requests(year=${nextYear}, month=${nextMonth})}">
                翌月
            </a>
        </div>

        <p>
            <a href="/shift-requests/new">勤務希望を新規登録する</a>
        </p>

        <div class="shift-request-groups">

            <!-- 勤務希望が1件もない場合 -->
            <p th:if="${#maps.isEmpty(shiftRequestsByDate)}">
                この月の勤務希望はありません。
            </p>

            <!-- 日付ごとに表示 -->
            <details th:each="entry : ${shiftRequestsByDate}" class="shift-request-day">

                <summary>
                    <strong th:text="${entry.key}">2026-08-01</strong>
                    <span th:text="${entry.value.size()} + '件'">5件</span>
                </summary>

                <table>
                    <thead>
                        <tr>
                            <th>従業員名</th>
                            <th>開始時刻</th>
                            <th>終了時刻</th>
                            <th>希望区分</th>
                            <th>操作</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="shiftRequest : ${entry.value}">
                            <td th:text="${shiftRequest.employee.name}">
                                山田 太郎
                            </td>

                            <td th:text="${shiftRequest.startTime != null ? shiftRequest.startTime : '-'}">
                                10:00
                            </td>

                            <td th:text="${shiftRequest.endTime != null ? shiftRequest.endTime : '-'}">
                                14:00
                            </td>

                            <td th:text="${shiftRequest.requestType}">
                                出勤希望
                            </td>

                            <td>
                                <a th:href="@{/shift-requests/{id}/edit(id=${shiftRequest.id})}">
                                    編集
                                </a>

                                <form th:action="@{/shift-requests/{id}/delete(id=${shiftRequest.id})}" method="post"
                                    style="display:inline;">
                                    <button type="submit" class="danger-button"
                                        onclick="return confirm('この勤務希望を削除しますか？');">
                                        削除
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </details>

        </div>

        <p>
            <a href="/">トップページへ戻る</a>
        </p>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不足時間確認</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js@8.3.2/minified/introjs.min.css">
</head>

<body>
    <div class="container">
        <h1>不足時間確認</h1>

        <p class="page-description">
            必要人数と作成済みシフト人数を30分単位で比較
        </p>

        <table id="tutorial-shortage-detail">
            <thead>
                <tr>
                    <th>時間帯</th>
                    <th>必要人数</th>
                    <th>配置</th>
                    <th>不足人数</th>
                    <th>状態</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${shortageRows}" th:classappend="${row.shortage} ? 'shortage'">
                    <td>
                        <span th:text="${row.startTime}">09:00</span>
                        <span th:text="${row.endTime}">11:00</span>
                    </td>
                    <td th:text="${row.requiredCount}">3</td>
                    <td th:text="${row.availableCount}">2</td>
                    <td th:text="${row.shortageCount}">1</td>
                    <td>
                        <span th:class="${row.shortage} ? 'status-badge shortage-badge' : 'status-badge enough-badge'"
                            th:text="${row.statusText}">
                            不足あり
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>

        <p class="back-link">
            <a href="/">トップページへ戻る</a>
        </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/intro.js@8.3.2/minified/intro.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const tutorialStep = sessionStorage.getItem('tutorialStep');

            console.log('STEP12ページ');
            console.log('tutorialStep =', tutorialStep);

            if (tutorialStep === '12') {

                const target = document.querySelector('#tutorial-shortage-detail');

                console.log('STEP12対象要素 =', target);

                if (!target) {
                    console.log('STEP12の対象要素が見つかりません');
                    return;
                }

                const tour = introJs.tour();

                tour.setOptions({
                    steps: [
                        {
                            element: target,
                            title: 'STEP 12',
                            intro: 'ここでは、30分単位で必要人数・配置人数・不足人数を確認できます。'
                        }
                    ],

                    doneLabel: '次へ',
                    exitOnEsc: true,
                    exitOnOverlayClick: true,
                    disableInteraction: true
                });

                tour.onComplete(function () {

                    // トップページで終了メッセージを表示するために保存
                    sessionStorage.setItem('tutorialStep', 'complete');

                    window.location.href = '/';
                });


                tour.start();
            }
        });
    </script>
</body>

</html>
